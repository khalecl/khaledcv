    <script>
                // ===== DOCUMENT AUTHENTICITY LAYER =====
        const DOC_META = {
            author: 'Khaled Diab',
            company: 'Solartech UK',
            createdDaysAgo: 6,        // document "created" this many days ago
            editMinutes: 0            // 0 = pick a realistic random value
        };

        let RSID_POOL = [];
        let NUM_INSTANCES = [];
        function randHex8() {
            let s = '';
            for (let i = 0; i < 8; i++) s += '0123456789ABCDEF'[Math.floor(Math.random() * 16)];
            return s;
        }

        function buildRsidPool() {
            const n = 18 + Math.floor(Math.random() * 14);   // 18-31 editing sessions
            RSID_POOL = [];
            for (let i = 0; i < n; i++) RSID_POOL.push(randHex8());
        }

        // Stamp paragraphs with revision-save IDs, clustered like real editing sessions
        function injectRsids(xml) {
            let cur = RSID_POOL[0];
            let run = 0;
            return xml.replace(/<w:p>/g, () => {
                if (run <= 0) {
                    cur = RSID_POOL[Math.floor(Math.random() * RSID_POOL.length)];
                    run = 3 + Math.floor(Math.random() * 10);
                }
                run--;
                const p = Math.random() < 0.25
                    ? RSID_POOL[Math.floor(Math.random() * RSID_POOL.length)]
                    : cur;
                return '<w:p w:rsidR="' + cur + '" w:rsidRDefault="' + cur + '" w:rsidP="' + p + '">';
            });
        }

        function isoStamp(date) {
            const p = n => String(n).padStart(2, '0');
            return date.getUTCFullYear() + '-' + p(date.getUTCMonth() + 1) + '-' + p(date.getUTCDate())
                 + 'T' + p(date.getUTCHours()) + ':' + p(date.getUTCMinutes()) + ':00Z';
        }

        function getCoreXml() {
            const now = new Date();
            const created = new Date(now.getTime() - DOC_META.createdDaysAgo * 86400000
                                     - Math.floor(Math.random() * 6) * 3600000);
            const modified = new Date(now.getTime() - Math.floor(Math.random() * 40) * 3600000);
            const rev = 3 + Math.floor(Math.random() * 12);
            return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties"'
                + ' xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/"'
                + ' xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">'
                + '<dc:creator>' + escapeXml(DOC_META.author) + '</dc:creator>'
                + '<cp:lastModifiedBy>' + escapeXml(DOC_META.author) + '</cp:lastModifiedBy>'
                + '<cp:revision>' + rev + '</cp:revision>'
                + '<dcterms:created xsi:type="dcterms:W3CDTF">' + isoStamp(created) + '</dcterms:created>'
                + '<dcterms:modified xsi:type="dcterms:W3CDTF">' + isoStamp(modified) + '</dcterms:modified>'
                + '</cp:coreProperties>';
        }

        function getAppXml(markdown) {
            const words = markdown.split(/\s+/).filter(Boolean).length;
            const chars = markdown.length;
            const pages = Math.max(1, Math.round(words / 420));
            const total = DOC_META.editMinutes || (45 + Math.floor(Math.random() * 165));
            return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"'
                + ' xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes">'
                + '<Template>Normal.dotm</Template>'
                + '<TotalTime>' + total + '</TotalTime>'
                + '<Pages>' + pages + '</Pages>'
                + '<Words>' + words + '</Words>'
                + '<Characters>' + chars + '</Characters>'
                + '<Application>Microsoft Office Word</Application>'
                + '<DocSecurity>0</DocSecurity>'
                + '<Lines>' + Math.round(words / 11) + '</Lines>'
                + '<Paragraphs>' + Math.round(words / 55) + '</Paragraphs>'
                + '<Company>' + escapeXml(DOC_META.company) + '</Company>'
                + '<LinksUpToDate>false</LinksUpToDate>'
                + '<CharactersWithSpaces>' + (chars + words) + '</CharactersWithSpaces>'
                + '<SharedDoc>false</SharedDoc>'
                + '<HyperlinksChanged>false</HyperlinksChanged>'
                + '<AppVersion>16.0000</AppVersion>'
                + '</Properties>';
        }

        function getSettings() {
            let rs = '<w:rsids><w:rsidRoot w:val="' + RSID_POOL[0] + '"/>';
            for (const r of RSID_POOL) rs += '<w:rsid w:val="' + r + '"/>';
            rs += '</w:rsids>';
            return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<w:settings xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
                + '<w:zoom w:percent="100"/>'
                + '<w:defaultTabStop w:val="720"/>'
                + '<w:characterSpacingControl w:val="doNotCompress"/>'
                + '<w:compat><w:compatSetting w:name="compatibilityMode"'
                + ' w:uri="http://schemas.microsoft.com/office/word" w:val="15"/></w:compat>'
                + rs
                + '<w:themeFontLang w:val="en-GB"/>'
                + '</w:settings>';
        }

        function getFontTable() {
            return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<w:fonts xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
                                + '<w:font w:name="Segoe UI"><w:panose1 w:val="020B0502040204020203"/><w:charset w:val="00"/>'
                + '<w:family w:val="swiss"/><w:pitch w:val="variable"/></w:font>'
                + '<w:font w:name="Georgia"><w:panose1 w:val="02040502050405020303"/><w:charset w:val="00"/>'
                + '<w:family w:val="roman"/><w:pitch w:val="variable"/></w:font>'
                + '<w:font w:name="Segoe UI Emoji"><w:panose1 w:val="020B0502040204020203"/><w:charset w:val="00"/>'
                + '<w:family w:val="swiss"/><w:pitch w:val="variable"/></w:font>'
                + '<w:font w:name="Calibri"><w:panose1 w:val="020F0502020204030204"/><w:charset w:val="00"/>'
                + '<w:family w:val="swiss"/><w:pitch w:val="variable"/></w:font>'
                + '<w:font w:name="Cambria"><w:panose1 w:val="02040503050406030204"/><w:charset w:val="00"/>'
                + '<w:family w:val="roman"/><w:pitch w:val="variable"/></w:font>'
                + '<w:font w:name="Courier New"><w:panose1 w:val="02070309020205020404"/><w:charset w:val="00"/>'
                + '<w:family w:val="modern"/><w:pitch w:val="fixed"/></w:font>'
                + '<w:font w:name="Times New Roman"><w:panose1 w:val="02020603050405020304"/><w:charset w:val="00"/>'
                + '<w:family w:val="roman"/><w:pitch w:val="variable"/></w:font>'
                + '</w:fonts>';
        }

        function getWebSettings() {
            return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<w:webSettings xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
                + '<w:optimizeForBrowser/><w:allowPNG/></w:webSettings>';
        }

        function getFooter() {
            return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<w:ftr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
                + '<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:before="0" w:after="0"/></w:pPr>'
                + '<w:r><w:rPr><w:sz w:val="18"/><w:color w:val="808080"/></w:rPr>'
                + '<w:fldChar w:fldCharType="begin"/></w:r>'
                + '<w:r><w:rPr><w:sz w:val="18"/><w:color w:val="808080"/></w:rPr>'
                + '<w:instrText xml:space="preserve"> PAGE </w:instrText></w:r>'
                + '<w:r><w:rPr><w:sz w:val="18"/><w:color w:val="808080"/></w:rPr>'
                + '<w:fldChar w:fldCharType="end"/></w:r>'
                + '</w:p></w:ftr>';
        }

        function getTheme() {
            const fill = '<a:solidFill><a:schemeClr val="phClr"/></a:solidFill>';
            const ln = '<a:ln w="6350" cap="flat" cmpd="sng" algn="ctr">' + fill
                     + '<a:prstDash val="solid"/></a:ln>';
            return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<a:theme xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" name="Office Theme">'
                + '<a:themeElements><a:clrScheme name="Office">'
                + '<a:dk1><a:sysClr val="windowText" lastClr="000000"/></a:dk1>'
                + '<a:lt1><a:sysClr val="window" lastClr="FFFFFF"/></a:lt1>'
                + '<a:dk2><a:srgbClr val="44546A"/></a:dk2><a:lt2><a:srgbClr val="E7E6E6"/></a:lt2>'
                + '<a:accent1><a:srgbClr val="4472C4"/></a:accent1><a:accent2><a:srgbClr val="ED7D31"/></a:accent2>'
                + '<a:accent3><a:srgbClr val="A5A5A5"/></a:accent3><a:accent4><a:srgbClr val="FFC000"/></a:accent4>'
                + '<a:accent5><a:srgbClr val="5B9BD5"/></a:accent5><a:accent6><a:srgbClr val="70AD47"/></a:accent6>'
                + '<a:hlink><a:srgbClr val="0563C1"/></a:hlink><a:folHlink><a:srgbClr val="954F72"/></a:folHlink>'
                + '</a:clrScheme><a:fontScheme name="Office">'
                + '<a:majorFont><a:latin typeface="Georgia"/><a:ea typeface=""/><a:cs typeface=""/></a:majorFont>'
                + '<a:minorFont><a:latin typeface="Segoe UI"/><a:ea typeface=""/><a:cs typeface=""/></a:minorFont>'
                + '</a:fontScheme><a:fmtScheme name="Office">'
                + '<a:fillStyleLst>' + fill + fill + fill + '</a:fillStyleLst>'
                + '<a:lnStyleLst>' + ln + ln + ln + '</a:lnStyleLst>'
                + '<a:effectStyleLst><a:effectStyle><a:effectLst/></a:effectStyle>'
                + '<a:effectStyle><a:effectLst/></a:effectStyle>'
                + '<a:effectStyle><a:effectLst/></a:effectStyle></a:effectStyleLst>'
                + '<a:bgFillStyleLst>' + fill + fill + fill + '</a:bgFillStyleLst>'
                + '</a:fmtScheme></a:themeElements><a:objectDefaults/><a:extraClrSchemeLst/></a:theme>';
        }
        // ===== END AUTHENTICITY LAYER =====
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const convertBtn = document.getElementById('convertBtn');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const messageEl = document.getElementById('message');
        const mdFile = document.getElementById('mdFile');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');

        function setProgress(percent) {
            progressBar.style.width = percent + '%';
        }

        function showProgress() {
            progressContainer.classList.add('active');
            setProgress(0);

        function convertMathMLNode(node) {

            if (node.nodeType !== 1) return '';

            const tag = node.tagName.toLowerCase();

            switch (tag) {

                    // Process first child (presentation MathML)
                    if (node.firstElementChild) return convertMathMLNode(node.firstElementChild);
                    return '';
                case 'annotation':
                    return '';
                case 'math':
                    return convertMathMLChildren(node);
                case 'mrow':
                    return convertMathMLChildren(node);
                case 'mi': {
                    const text = node.textContent.trim();
                    // Italic for single-char identifiers
                    if (text.length === 1 && text.match(/[a-zA-Z]/)) {
                        return '<m:r><m:rPr><m:sty m:val="i"/></m:rPr><m:t>' + escapeXml(text) + '</m:t></m:r>';
                    }
                    return wrapOMMLRun(text);

                }
                case 'msub': {
                    const base = node.children[0];
                    const sub = node.children[1];
                    if (!base || !sub) return convertMathMLChildren(node);
                    return '<m:sSub><m:e>' + convertMathMLNode(base) + '</m:e><m:sub>' + convertMathMLNode(sub) + '</m:sub></m:sSub>';
                }
                case 'msubsup': {
                    const base = node.children[0];
                    const sub = node.children[1];
                    const sup = node.children[2];
                    if (!base || !sub || !sup) return convertMathMLChildren(node);
                    return '<m:sSubSup><m:e>' + convertMathMLNode(base) + '</m:e><m:sub>' + convertMathMLNode(sub) + '</m:sub><m:sup>' + convertMathMLNode(sup) + '</m:sup></m:sSubSup>';
                }
                case 'mfrac': {
                    const num = node.children[0];
                    const den = node.children[1];
                    if (!num || !den) return convertMathMLChildren(node);
                    return '<m:f><m:num>' + convertMathMLNode(num) + '</m:num><m:den>' + convertMathMLNode(den) + '</m:den></m:f>';
                }
                case 'msqrt':
                    return '<m:rad><m:radPr><m:degHide m:val="1"/></m:radPr><m:deg/><m:e>' + convertMathMLChildren(node) + '</m:e></m:rad>';
                case 'mroot': {
                    const base = node.children[0];
                    const idx = node.children[1];
                    if (!base || !idx) return convertMathMLChildren(node);
                    return '<m:rad><m:deg>' + convertMathMLNode(idx) + '</m:deg><m:e>' + convertMathMLNode(base) + '</m:e></m:rad>';
                }
                case 'mover': {
                    const base = node.children[0];
                    const over = node.children[1];
                    if (!base || !over) return convertMathMLChildren(node);
                    const overText = over.textContent.trim();
                    // Common accents
                    if (overText === '¯' || overText === '‾') {
                        return '<m:bar><m:barPr><m:pos m:val="top"/></m:barPr><m:e>' + convertMathMLNode(base) + '</m:e></m:bar>';
                    }
                    return '<m:limUpp><m:e>' + convertMathMLNode(base) + '</m:e><m:lim>' + convertMathMLNode(over) + '</m:lim></m:limUpp>';
                }
                case 'munder': {
                    const base = node.children[0];
                    const under = node.children[1];
                    if (!base || !under) return convertMathMLChildren(node);
                    return '<m:limLow><m:e>' + convertMathMLNode(base) + '</m:e><m:lim>' + convertMathMLNode(under) + '</m:lim></m:limLow>';
                }
                case 'munderover': {
                    const base = node.children[0];
                    const under = node.children[1];
                    const over = node.children[2];
                    if (!base || !under || !over) return convertMathMLChildren(node);
                    // Check if base is an integral/sum operator
                    const baseText = base.textContent.trim();
                    if ('∫∬∮∑∏'.includes(baseText)) {
                        return '<m:nary><m:naryPr><m:chr m:val="' + escapeXml(baseText) + '"/></m:naryPr><m:sub>' + convertMathMLNode(under) + '</m:sub><m:sup>' + convertMathMLNode(over) + '</m:sup><m:e></m:e></m:nary>';
                    }
                    return '<m:limLow><m:e><m:limUpp><m:e>' + convertMathMLNode(base) + '</m:e><m:lim>' + convertMathMLNode(over) + '</m:lim></m:limUpp></m:e><m:lim>' + convertMathMLNode(under) + '</m:lim></m:limLow>';

                    let omml = '<m:m>';

                    omml += '</m:m>';
                    return omml;
                }
                case 'mtr':
                case 'mtd':
                    return convertMathMLChildren(node);
                case 'mspace':
                    return '';
                case 'mpadded':
                    return convertMathMLChildren(node);
                case 'mstyle':
                    return convertMathMLChildren(node);
                case 'menclose':
                    return convertMathMLChildren(node);
                case 'mphantom':
                    return '';
                default:
                    return convertMathMLChildren(node);
            }
        }

	async function markdownToDocx(markdown) {

            const mermaidBlocksList = [];

                mermaidBlocksList.push({ key, code: mm[1].trim(), fullMatch: mm[0] });
            }

            // ---- Mask code + escaped dollars so math scanning never touches them ----
            // Mask fenced code blocks and inline code, and turn \$ into a sentinel.
            // Positions found in the masked string map 1:1 back to `markdown` because
            // every mask/sentinel replacement preserves character length is NOT true,
            // so we scan the masked string and store the masked-string offsets, then
            // replace on a separate masked copy that we later restore. See below.
            const SENT_ESC = '\uE001';                       // stands in for \$
            const codeMasks = [];
            let masked = markdown;
            masked = masked.replace(/```[\s\S]*?```/g, (mtxt) => {
                const tok = '\uE000C' + codeMasks.length + '\uE000';
                codeMasks.push(mtxt); return tok;
            });
            masked = masked.replace(/`[^`\n]*`/g, (mtxt) => {
                const tok = '\uE000I' + codeMasks.length + '\uE000';
                codeMasks.push(mtxt); return tok;
            });
            masked = masked.replace(/\\\$/g, SENT_ESC);

            // Extract display LaTeX from the MASKED string
            const displayRegex = /\$\$([\s\S]*?)\$\$/g;
            const displayLatexBlocks = [];
            let m;
            while ((m = displayRegex.exec(masked)) !== null) {
                const key = 'latex_display_' + imageIndex++;
                const latex = m[1].trim().split(SENT_ESC).join('\\$');   // restore \$ inside latex
                displayLatexBlocks.push({ key, latex, fullMatch: m[0], start: m.index, end: m.index + m[0].length });
            }

            // Build display range set for O(1) lookup (offsets are in `masked`)
            const displayRangeSet = new Set();
            for (const block of displayLatexBlocks) {
                for (let i = block.start; i < block.end; i++) displayRangeSet.add(i);
            }

            // Extract inline LaTeX from the MASKED string, with currency guards
            const inlineRegex = /\$([^\$\n]+?)\$/g;

            while ((im = inlineRegex.exec(masked)) !== null) {

                const content = im[1];

                if (/[A-Za-z0-9]/.test(before)) continue;                    // US$, 3$ -> currency
                if (/^\s|\s$/.test(content)) continue;                       // "$ x $" -> not math
                if (/^\d/.test(content) && !/[\\{}^_]/.test(content)) continue; // $30M -> currency
                const key = 'latex_inline_' + imageIndex++;

            setProgress(20);

            while ((m = BOLD_REGEX.exec(text)) !== null) {
                markers.push({ start: m.index, end: m.index + m[0].length, type: 'bold', text: m[1] });
            }
            while ((m = ITALIC_REGEX.exec(text)) !== null) {
                markers.push({ start: m.index, end: m.index + m[0].length, type: 'italic', text: m[1] });
            }
            while ((m = ITALIC_UNDERSCORE_REGEX.exec(text)) !== null) {

            while ((m = CODE_REGEX.exec(text)) !== null) {
                markers.push({ start: m.index, end: m.index + m[0].length, type: 'code', text: m[1] });

            markers.sort((a, b) => a.start - b.start);
            const filtered = [];
            let lastEnd = -1;
            for (const marker of markers) {
                if (marker.start >= lastEnd) {
                    filtered.push(marker);
                    lastEnd = marker.end;

                if (marker.start > lastIndex) {

                lastIndex = marker.end;

                result.push({ type: 'text', text: text.substring(lastIndex) });

            const bulFonts = ['Symbol', 'Courier New', 'Wingdings', 'Symbol', 'Courier New'];

                + '<w:numbering xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">';

            xml += '<w:abstractNum w:abstractNumId="0">'
                 + '<w:multiLevelType w:val="hybridMultilevel"/>';
            for (let l = 0; l < 5; l++) {
                xml += '<w:lvl w:ilvl="' + l + '">'
                     + '<w:start w:val="1"/>'
                     + '<w:numFmt w:val="' + decFmts[l] + '"/>'
                     + '<w:lvlText w:val="%' + (l + 1) + '."/>'
                     + '<w:lvlJc w:val="left"/>'
                     + '<w:pPr><w:ind w:left="' + lvlIndent(l) + '" w:hanging="360"/></w:pPr>'
                     + '</w:lvl>';
            }
            xml += '</w:abstractNum>';

            // abstractNum 1 — bullets
            xml += '<w:abstractNum w:abstractNumId="1">'
                 + '<w:multiLevelType w:val="hybridMultilevel"/>';
            for (let l = 0; l < 5; l++) {
                xml += '<w:lvl w:ilvl="' + l + '">'
                     + '<w:start w:val="1"/>'
                     + '<w:numFmt w:val="bullet"/>'
                     + '<w:lvlText w:val="' + bulChars[l] + '"/>'
                     + '<w:lvlJc w:val="left"/>'
                     + '<w:pPr><w:ind w:left="' + lvlIndent(l) + '" w:hanging="360"/></w:pPr>'
                     + '<w:rPr><w:rFonts w:ascii="' + bulFonts[l] + '" w:hAnsi="' + bulFonts[l] + '"'
                     + ' w:hint="default"/></w:rPr>'
                     + '</w:lvl>';

            for (const inst of NUM_INSTANCES) {

                     + '<w:abstractNumId w:val="' + inst.abstractId + '"/>';

            xml += '</w:numbering>';
            return xml;

	        // Pre-compile table separator regex
        const TABLE_SEPARATOR_REGEX = /^\s*\|\s*:?-+:?\s*(?:\|\s*:?-+:?\s*)*\|?\s*$/;
        
        function parseTableRows(tableLines) {
            const dataRows = [];
            let headerFound = false;
            
            for (let i = 0; i < tableLines.length; i++) {
                const line = tableLines[i];
                
                // Check if this is a separator row (only pipes and dashes)
                if (TABLE_SEPARATOR_REGEX.test(line)) {
                    if (dataRows.length === 1 && !headerFound) {
                        dataRows[0].isHeader = true;
                        headerFound = true;
                    }
                    continue;
                }
                
                // Parse cells efficiently: split, trim, filter in one pass
                const rawCells = line.split('|');
                const cells = [];
                for (let j = 0; j < rawCells.length; j++) {
                    const trimmed = rawCells[j].trim();
                    if (trimmed.length > 0) cells.push(trimmed);
                }
                
                if (cells.length > 0) {
                    dataRows.push({ cells, isHeader: false });
                }
            }
            
            if (!headerFound && dataRows.length > 0) {
                dataRows[0].isHeader = true;
            }
            
            return dataRows;
        }

           // Usable text width on A4 with your margins: 11906 - 1418 - 1276 = 9212 twips
        const USABLE_WIDTH = 9212;

        function buildTable(tableLines, ommlMap) {
            const rowData = parseTableRows(tableLines);
            if (rowData.length === 0) return '';

            const colCount = Math.max(...rowData.map(r => r.cells.length));

            // Weight columns by their longest cell content, clamped so no column
            // collapses to nothing or swallows the table
            const weights = new Array(colCount).fill(1);
            for (const row of rowData) {
                for (let c = 0; c < colCount; c++) {
                    const len = (row.cells[c] || '').length;
                    if (len > weights[c]) weights[c] = len;
                }
            }
            for (let c = 0; c < colCount; c++) {
                weights[c] = Math.min(Math.max(weights[c], 6), 60);
            }
            const totalW = weights.reduce((a, b) => a + b, 0);
            const colTwips = weights.map(w => Math.round(USABLE_WIDTH * w / totalW));
            // Absorb rounding drift into the last column
            colTwips[colCount - 1] += USABLE_WIDTH - colTwips.reduce((a, b) => a + b, 0);

            let xml = '<w:tbl><w:tblPr>';
            xml += '<w:tblW w:w="' + USABLE_WIDTH + '" w:type="dxa"/>';
            xml += '<w:tblLayout w:type="fixed"/>';
            xml += '<w:tblInd w:w="0" w:type="dxa"/>';
            xml += '<w:tblBorders>';
            xml += '<w:top w:val="single" w:sz="12" w:space="0" w:color="595959"/>';
            xml += '<w:bottom w:val="single" w:sz="12" w:space="0" w:color="595959"/>';
            xml += '<w:insideH w:val="single" w:sz="4" w:space="0" w:color="BFBFBF"/>';
            xml += '<w:insideV w:val="none" w:sz="0" w:space="0" w:color="auto"/>';
            xml += '</w:tblBorders>';
            xml += '<w:tblCellMar>';
            xml += '<w:top w:w="80" w:type="dxa"/>';
            xml += '<w:left w:w="130" w:type="dxa"/>';
            xml += '<w:bottom w:w="80" w:type="dxa"/>';
            xml += '<w:right w:w="130" w:type="dxa"/>';
            xml += '</w:tblCellMar>';
            xml += '</w:tblPr>';

            // The grid Word actually lays the table out from — this was missing entirely
            xml += '<w:tblGrid>';
            for (let c = 0; c < colCount; c++) {
                xml += '<w:gridCol w:w="' + colTwips[c] + '"/>';
            }
            xml += '</w:tblGrid>';

            rowData.forEach(row => {
                const isHeader = row.isHeader;
                xml += '<w:tr><w:trPr><w:cantSplit/>';
                if (isHeader) xml += '<w:tblHeader/>';
                xml += '</w:trPr>';

                const cells = [...row.cells];
                while (cells.length < colCount) cells.push('');

                cells.slice(0, colCount).forEach((cell, c) => {
                    xml += '<w:tc><w:tcPr>';
                    xml += '<w:tcW w:w="' + colTwips[c] + '" w:type="dxa"/>';
                    if (isHeader) xml += '<w:shd w:val="clear" w:color="auto" w:fill="EDEDED"/>';
                    xml += '<w:vAlign w:val="' + (isHeader ? 'center' : 'top') + '"/>';
                    xml += '</w:tcPr>';
                    xml += '<w:p><w:pPr><w:pStyle w:val="TableText"/>';
                    if (isHeader) xml += '<w:rPr><w:b/></w:rPr>';
                    xml += '</w:pPr>';
                    xml += formatTextWithInlineOmml(cell.trim(), ommlMap || {}, isHeader);
                    xml += '</w:p></w:tc>';
                });
                xml += '</w:tr>';

            xml += '</w:tbl>';

            // jams the next paragraph against the bottom border
            xml += '<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/>'
                 + '<w:rPr><w:sz w:val="12"/></w:rPr></w:pPr></w:p>';
            return xml;
        }

        // Detect the document's nesting unit (2 spaces vs 4 spaces) from its own content
        let INDENT_UNIT = 2;

        function computeIndentUnit(lines) {
            let minIndent = 99;
            for (const line of lines) {
                if (!/^[ \t]+([\*\-\+]|\d+\.)\s/.test(line)) continue;
                const m = line.match(/^ +/);
                if (m && m[0].length > 0 && m[0].length < minIndent) minIndent = m[0].length;
            }
            INDENT_UNIT = (minIndent === 99) ? 2 : minIndent;
            if (INDENT_UNIT < 1) INDENT_UNIT = 2;
        }

        function detectListLevel(line) {
            let spaces = 0;
            let i = 0;
            while (i < line.length) {
                if (line[i] === '\t') { spaces += INDENT_UNIT; i++; }
                else if (line[i] === ' ') { spaces++; i++; }
                else break;
            }
            let level = Math.floor(spaces / INDENT_UNIT);
            if (level > 4) level = 4;                    // numbering.xml defines 0-4
            return { level, trimmedLine: line.substring(i) };
        }

        function getIndentValue(level) {
            return level * 720;
        }

        function getParagraphIndent(line) {
            const match = line.match(/^::indent:(\d+)::/);
            if (match) {
                return { indent: parseInt(match[1]), text: line.replace(/^::indent:\d+::/, '').trim() };
            }
            return null;
        }
	// Cache for repeated string building

        function buildImageXml(rId, widthPx, heightPx, isInline) {
            const cacheKey = rId + '-' + widthPx + '-' + heightPx;
            if (imageXmlCache.has(cacheKey)) return imageXmlCache.get(cacheKey);
            
            // Convert pixels to EMUs (1 px = 9525 EMU), scale x2 render down
            const scale = 0.5;
            let emuW = Math.round(widthPx * 9525 * scale);
            let emuH = Math.round(heightPx * 9525 * scale);
            // Cap max width at 15cm (5400000 EMU)
            const maxW = 5400000;
            if (emuW > maxW) {
                const ratio = maxW / emuW;
                emuW = maxW;
                emuH = Math.round(emuH * ratio);
            }
            const id = Math.floor(Math.random() * 100000);

            imageXmlCache.set(cacheKey, result);
            return result;
        }

      function getWordDocumentWithImages(masked, displayLatexBlocks, inlineLatexBlocks, mermaidBlocksList, imageRelMap, ommlMap, codeMasks, SENT_ESC) {

            // Replace math spans by placeholder using POSITIONS (descending) so
            // duplicate expressions and identical text can't collide, and nothing
            // is missed. Offsets are valid against `masked`.
            const mathSpans = [];
            for (const block of displayLatexBlocks) mathSpans.push({ start: block.start, end: block.end, ph: '::latex_display::' + block.key + '::' });
            for (const block of inlineLatexBlocks) mathSpans.push({ start: block.start, end: block.end, ph: '::latex_inline::' + block.key + '::' });
            mathSpans.sort((a, b) => b.start - a.start);
            for (const sp of mathSpans) {
                processed = processed.slice(0, sp.start) + sp.ph + processed.slice(sp.end);
            }

            // Restore escaped dollars (now literal $) that were OUTSIDE any math span
            if (SENT_ESC) processed = processed.split(SENT_ESC).join('$');

            // Restore fenced/inline code, then swap mermaid code fences for placeholders
            if (codeMasks && codeMasks.length) {
                processed = processed.replace(/\uE000[CI](\d+)\uE000/g, (_, n) => codeMasks[+n]);
            }
            for (const block of mermaidBlocksList) {
                processed = processed.replace(block.fullMatch, '::mermaid_image::' + block.key + '::');

            // Reset numbering registry for this conversion
            NUM_INSTANCES = [];
            let numIdCounter = 0;
            let activeOrderedNumId = null;   // null when we are not inside an ordered list
            let activeBulletNumId = null;

            function newNumId(abstractId) {
                numIdCounter++;
                const id = numIdCounter;
                NUM_INSTANCES.push({ numId: id, abstractId: abstractId });
                return id;
            }
            let xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math"><w:body>';

            const lines = processed.split(/\r?\n/);
            computeIndentUnit(lines);
            let inTable = false;
            let tableLines = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];

                // Any line that is neither a list item nor blank terminates the current list
                // (placeholder lines for math/mermaid must NOT break list continuity)
                const trimmed = line.trim();
                const isPlaceholder = /^::(latex_display|mermaid_image)::.+::$/.test(trimmed);
                const isListLine = /^[ \t]*([\*\-\+]|\d+\.)\s/.test(line);
                if (!isListLine && trimmed !== '' && !isPlaceholder) {
                    activeOrderedNumId = null;
                    activeBulletNumId = null;
                }

                if (inTable && !line.includes('|')) {
                    xml += buildTable(tableLines, ommlMap);
                    tableLines = [];
                    inTable = false;
                }

                // Mermaid image placeholder (allow leading whitespace from list indentation)
                const mermaidMatch = trimmed.match(/^::mermaid_image::(.+)::$/);
                if (mermaidMatch) {
                    const key = mermaidMatch[1];
                    const img = imageRelMap[key];
                    if (img) {
                        xml += '<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r>' + buildImageXml(img.rId, img.width, img.height, false) + '</w:r></w:p>';
                    }
                    continue;
                }

                // Display LaTeX → native OMML equation paragraph (allow leading whitespace)
                const latexMatch = trimmed.match(/^::latex_display::(.+)::$/);
                if (latexMatch) {
                    const key = latexMatch[1];
                    const omml = ommlMap[key];
                    if (omml) {
                        xml += '<w:p><w:pPr><w:jc w:val="center"/></w:pPr><m:oMathPara><m:oMathParaPr><m:jc m:val="center"/></m:oMathParaPr>' + omml + '</m:oMathPara></w:p>';
                    }
                    continue;
                }

                // Check for custom indent syntax
                const customIndent = getParagraphIndent(line);
                if (customIndent) {
                    const indentValue = getIndentValue(customIndent.indent);
                    xml += '<w:p><w:pPr><w:pStyle w:val="Normal"/><w:ind w:left="' + indentValue + '"/></w:pPr>' + formatTextWithInlineOmml(customIndent.text, ommlMap) + '</w:p>';
                }
                else if (line.match(/^#\s/)) {
                    const text = line.replace(/^#\s/, '');
                    xml += '<w:p><w:pPr><w:pStyle w:val="Title"/></w:pPr>' + formatTextWithInlineOmml(text, ommlMap) + '</w:p>';
                }
                else if (line.match(/^##\s/)) {
                    const text = line.replace(/^##\s/, '');
                    xml += '<w:p><w:pPr><w:pStyle w:val="Heading1"/></w:pPr>' + formatTextWithInlineOmml(text, ommlMap) + '</w:p>';
                }
                else if (line.match(/^###\s/)) {
                    const text = line.replace(/^###\s/, '');
                    xml += '<w:p><w:pPr><w:pStyle w:val="Heading2"/></w:pPr>' + formatTextWithInlineOmml(text, ommlMap) + '</w:p>';
                }
                else if (line.match(/^####\s/)) {
                    const text = line.replace(/^####\s/, '');
                    xml += '<w:p><w:pPr><w:pStyle w:val="Heading3"/></w:pPr>' + formatTextWithInlineOmml(text, ommlMap) + '</w:p>';
                }
                                else if (line.match(/^#####\s/)) {
                    const text = line.replace(/^#####\s/, '');
                    xml += '<w:p><w:pPr><w:pStyle w:val="Heading4"/></w:pPr>' + formatTextWithInlineOmml(text, ommlMap) + '</w:p>';
                }
                else if (line.match(/^[ \t]*\d+\.\s/)) {
                    const { level, trimmedLine } = detectListLevel(line);
                    const text = trimmedLine.replace(/^\d+\.\s+/, '');
                    // Start a new numbering instance whenever a fresh list begins
                    if (activeOrderedNumId === null) activeOrderedNumId = newNumId(0);
                    activeBulletNumId = null;
                    xml += '<w:p><w:pPr><w:pStyle w:val="ListParagraph"/>'
                        + '<w:numPr><w:ilvl w:val="' + level + '"/>'
                        + '<w:numId w:val="' + activeOrderedNumId + '"/></w:numPr></w:pPr>'
                        + formatTextWithInlineOmml(text, ommlMap) + '</w:p>';
                }
                else if (line.match(/^[ \t]*[\*\-\+]\s/)) {
                    const { level, trimmedLine } = detectListLevel(line);
                    const text = trimmedLine.replace(/^[\*\-\+]\s+/, '');
                    if (activeBulletNumId === null) activeBulletNumId = newNumId(1);
                    activeOrderedNumId = null;
                    xml += '<w:p><w:pPr><w:pStyle w:val="ListParagraph"/>'
                        + '<w:numPr><w:ilvl w:val="' + level + '"/>'
                        + '<w:numId w:val="' + activeBulletNumId + '"/></w:numPr></w:pPr>'
                        + formatTextWithInlineOmml(text, ommlMap) + '</w:p>';
                }
                else if (line.match(/^>\s/)) {
                    const text = line.replace(/^>\s/, '');
                    xml += '<w:p><w:pPr><w:pStyle w:val="Quote"/></w:pPr>' + formatTextWithInlineOmml(text, ommlMap) + '</w:p>';
                }
                else if (line.trim().startsWith('```')) {
                    i++;
                    const code = [];
                    while (i < lines.length && !lines[i].trim().startsWith('```')) {
                        code.push(escapeXml(lines[i]));
                        i++;
                    }
                    let codeRuns = '';
                    code.forEach((cl, ci) => {
                        if (ci > 0) codeRuns += '<w:r><w:br/></w:r>';
                        codeRuns += '<w:r><w:rPr><w:rFonts w:ascii="Courier New" w:hAnsi="Courier New"/></w:rPr>'
                                  + '<w:t xml:space="preserve">' + cl + '</w:t></w:r>';
                    });
                    xml += '<w:p><w:pPr><w:pStyle w:val="Code"/></w:pPr>' + codeRuns + '</w:p>';
                }
                else if (line.includes('|')) {
                    inTable = true;
                    tableLines.push(line);
                }
                else if (line.match(/^---+$/)) {
                    xml += '<w:p><w:pPr><w:spacing w:before="200" w:after="200" w:line="240" w:lineRule="auto"/>'
                        + '<w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="BFBFBF"/></w:pBdr>'
                        + '<w:rPr><w:sz w:val="4"/></w:rPr></w:pPr></w:p>';
                }
                else if (line.trim()) {
                    xml += '<w:p><w:pPr><w:pStyle w:val="Normal"/></w:pPr>' + formatTextWithInlineOmml(line, ommlMap) + '</w:p>';
                }
            }

            if (inTable && tableLines.length > 0) {
                xml += buildTable(tableLines, ommlMap);
            }

            xml += '<w:sectPr>'
                + '<w:footerReference w:type="default" r:id="rId7"/>'
                + '<w:pgSz w:w="11906" w:h="16838"/>'
                + '<w:pgMar w:top="1418" w:right="1276" w:bottom="1418" w:left="1418"'
                + ' w:header="709" w:footer="709" w:gutter="0"/>'
                + '<w:cols w:space="708"/><w:docGrid w:linePitch="360"/>'
                + '</w:sectPr>';
            xml += '</w:body></w:document>';
                        return xml;
        }

        // Like formatTextToXml but also handles inline LaTeX image placeholders
        // Handle inline LaTeX as native OMML equations within text
        function formatTextWithInlineOmml(text, ommlMap, forceBold) {
            if (!text.includes('::latex_inline::')) {
                return formatTextToXml(text, forceBold);
            }

            // Protect placeholders, run the normal formatter (so **bold** that wraps a
            // placeholder is paired correctly), then swap placeholders for OMML.
            // formatTextToXml emits each placeholder inside its own <w:t> run; we
            // find those runs and replace them with the equation, preserving the
            // surrounding run's bold/italic properties by dropping the placeholder run.
            const parts = text.split(/(::latex_inline::[\w]+::)/);

            // Build a version where each placeholder is a unique unlikely token that
            // survives escapeXml unchanged, so we can locate it after formatting.
            const tokenMap = {};
            let tokenized = '';
            let ti = 0;
            for (const part of parts) {
                const match = part.match(/^::latex_inline::([\w]+)::$/);
                if (match) {
                    const tok = '\uE100' + (ti++) + '\uE100';
                    tokenMap[tok] = match[1];
                    tokenized += tok;
                } else {
                    tokenized += part;
                }
            }

            // Let the normal formatter handle bold/italic/code across the whole string.
            let xml = formatTextToXml(tokenized, forceBold);

            // Replace each tokenized run. A token sits inside a <w:t ...>...token...</w:t>.
            // Split that run so the equation is emitted as OMML while keeping any
            // text on either side of the token within the same original run props.
            for (const tok of Object.keys(tokenMap)) {
                const key = tokenMap[tok];
                const omml = ommlMap[key] || '';
                // Escaped token as it appears after escapeXml (the \uE100 chars pass through).
                const runRe = new RegExp(
                    '<w:r>(<w:rPr>[\\s\\S]*?</w:rPr>)?<w:t[^>]*>([\\s\\S]*?)' + tok + '([\\s\\S]*?)</w:t></w:r>'
                );
                xml = xml.replace(runRe, (whole, rpr, pre, post) => {
                    rpr = rpr || '';
                    let out = '';
                    if (pre) out += '<w:r>' + rpr + '<w:t xml:space="preserve">' + pre + '</w:t></w:r>';
                    out += omml;
                    if (post) out += '<w:r>' + rpr + '<w:t xml:space="preserve">' + post + '</w:t></w:r>';
                    return out;
                });
            }
            // Clean up any stray tokens (shouldn't happen, but be safe)
            xml = xml.replace(/\uE100\d+\uE100/g, '');
            return xml;
        }
    </script>
</body>
